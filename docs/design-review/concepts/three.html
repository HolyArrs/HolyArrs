<script>
const media=[['Dune','Movie','2021','Ready','dune.jpg'],['Interstellar','Movie','2014','Ready','interstellar.jpg'],['Blade Runner 2049','Movie','2017','Wanted','blade-runner.jpg'],['Arrival','Movie','2016','Ready','arrival.jpg'],['Breaking Bad','Show','5 seasons','Ready','breaking-bad.jpg'],['Dark','Show','3 seasons','Wanted','dark.jpg']].map(([name,kind,year,state,art])=>({name,kind,year,state,art}));
const pages=['home','library','search','wishlist','downloads','decisions','calendar','history','settings'];const labels={home:'Home',library:'Library',search:'Search',wishlist:'Wishlist',downloads:'Downloads',decisions:'Needs a decision',calendar:'Calendar',history:'History',settings:'Settings'};let page='library',selected=0,display='list',inspectorTab='versions',pending,approveName;const settled={};const main=document.querySelector('#main');
function head(title,copy){return `<header class="page-head"><div><h1>${title}</h1><p>${copy}</p></div></header>`}const art=x=>`background-image:url('../assets/${x.art}')`;
function savedViews(){const box=document.querySelector('#savedViews');if(page!=='library'){box.innerHTML='';return}const sets=[['All titles','6'],['Ready','4'],['Wanted','2'],['Movies','4'],['Shows','2']];box.innerHTML=`<div class="view-label">Saved views</div>${sets.map((x,i)=>`<button class="saved-view" data-saved="${x[0]}" aria-pressed="${i===0}">${x[0]} <span class="number">${x[1]}</span></button>`).join('')}`}
function library(search=false){return `${head(search?'Search Library':'Library',search?'Find a title across this fictional Library.':'Select titles, change the view and inspect files without leaving the table.')}<div class="view-tabs"><button aria-pressed="true">Titles</button><button data-note="Movie collections remain automatic in the product.">Movie collections</button></div><div class="toolbar"><input class="field" id="titleQuery" type="search" placeholder="Filter names" aria-label="Filter names"><select class="field" id="kindFilter" aria-label="Kind"><option>All kinds</option><option>Movies</option><option>Shows</option></select><select class="field" id="stateFilter" aria-label="State"><option>All states</option><option>Ready</option><option>Wanted</option></select><select class="field" id="groupFilter" aria-label="Sort by"><option>Default order</option><option>Kind</option><option>State</option></select><div class="segmented"><button id="listMode" aria-label="List view" aria-pressed="${display==='list'}">☷</button><button id="gridMode" aria-label="Grid view" aria-pressed="${display==='grid'}">▦</button></div></div><p class="subtle" id="resultCount" aria-live="polite"></p><div id="libraryResults"></div>`}
function home(){return `${head('Home','A compact operational summary for this fictional workspace.')}<div class="rows"><article class="row"><div><h2>2 Wishlist approvals</h2><p class="subtle">Arrival and Interstellar need review.</p></div><button class="button" data-page="wishlist">Review</button></article><article class="row"><div><h2>1 import decision</h2><p class="subtle">Choose a matching file for Dark · S03E04.</p></div><button class="button" data-page="decisions">Choose file</button></article><article class="row"><div><h2>2 active downloads</h2><p class="subtle">One downloading, one importing.</p></div><button class="button" data-page="downloads">Open</button></article></div>`}
function wishlist(){return `${head('Wishlist approvals','Choose a folder and Pick rules before a personal ask enters the Library.')}<div class="rows">${['Arrival','Interstellar'].map(x=>`<article class="row" data-wish="${x}"><div><h2>${x}</h2><p class="subtle">Asked by ${x==='Arrival'?'Maya':'Theo'} · fictional request</p></div><div class="row-actions">${settled[x]?`<span class="state">${settled[x]}</span>`:`<button class="button small" data-approve="${x}">Approve</button><button class="button small danger" data-decline="${x}">Turn down</button>`}</div></article>`).join('')}</div>`}
function downloads(){return `${head('Downloads','Active fictional jobs. Per-job pause is unavailable.')}<div class="rows">${[['Blade Runner 2049','68','Downloading'],['Dark · S03E04','92','Importing']].map(x=>`<article class="row"><div><h2>${x[0]}</h2><div class="progress"><i style="width:${x[1]}%"></i></div><p class="subtle">${x[1]}% · ${x[2]}</p></div><div class="row-actions"><button class="button small" data-job="${x[0]}" data-action="Mark failed">Mark failed</button><button class="button small danger" data-job="${x[0]}" data-action="Remove">Remove</button></div></article>`).join('')}</div>`}
function decisions(){return `${head('Needs a decision','Resolve an ambiguous file before import continues.')}<section class="row" id="decision"><div><h2>Dark · S03E04</h2><p class="subtle">Both files match this episode.</p>${['Dark.S03E04.1080p.WEB.mkv','Dark.S03E04.720p.WEB.mkv'].map((x,i)=>`<label class="choice"><input type="radio" name="file" value="${x}" ${i?'':'checked'}><span>${x}<br><span class="subtle">${i?'1.1':'2.4'} GB · English</span></span></label>`).join('')}</div><button class="button primary" id="useFile">Use selected</button></section>`}
function calendar(){return `${head('Calendar','Upcoming fictional movie and episode dates.')}<div class="toolbar"><select class="field" id="calendarFilter"><option>All kinds</option><option>Movies</option><option>Shows</option></select></div><div class="rows"><article class="row" data-kind="Shows"><div><h2>Dark · S03E05</h2><p class="subtle">October 24 · Episode</p></div><span class="tag">Show</span></article><article class="row" data-kind="Movies"><div><h2>Blade Runner 2049</h2><p class="subtle">October 29 · Release gate</p></div><span class="tag">Movie</span></article></div>`}
function history(){return `${head('History','Recent fictional events.')}<div class="toolbar"><input class="field" id="historyQuery" type="search" placeholder="Filter events"></div><div class="rows">${[['Dune','Imported HD version'],['Breaking Bad','Search completed'],['Arrival','File renamed']].map(x=>`<article class="row" data-history="${x.join(' ').toLowerCase()}"><div><h2>${x[0]}</h2><p class="subtle">${x[1]}</p></div><span class="tag">Today</span></article>`).join('')}</div>`}
function settings(){return `${head('Settings','Save configuration before testing the exact saved values.')}<div class="form-layout"><nav class="settings-nav" aria-label="Settings sections"><button aria-pressed="true">Downloaders</button><button data-note="Library folders remain a separate settings section.">Library folders</button><button data-note="Pick rules remain a separate settings section.">Pick rules</button><button data-note="Parts remain under system settings.">Parts</button></nav><form class="form" id="settingsForm"><h2>Downloader</h2><div class="form-row"><label for="name">Name</label><input id="name" value="Review downloader" required></div><div class="form-row"><label for="address">Address</label><input id="address" type="url" value="https://fixture.invalid" required><p class="subtle">Fictional value. No request is sent.</p></div><div class="form-footer"><output id="settingsStatus">No fixture changes saved.</output><button class="button primary">Save, then test</button></div></form></div>`}
function render(){main.innerHTML={home,library,search:()=>library(true),wishlist,downloads,decisions,calendar,history,settings}[page]();document.querySelector('#context').textContent=labels[page];document.querySelector('#viewTitle').textContent=labels[page];document.querySelectorAll('[data-page]').forEach(x=>x.setAttribute('aria-current',x.dataset.page===page?'page':'false'));savedViews();wire();if(['library','search'].includes(page))renderLibrary()}
function renderLibrary(){const q=document.querySelector('#titleQuery').value.toLowerCase(),kind=document.querySelector('#kindFilter').value,state=document.querySelector('#stateFilter').value,sort=document.querySelector('#groupFilter').value;const shown=media.filter(x=>x.name.toLowerCase().includes(q)&&(kind==='All kinds'||kind===x.kind+'s')&&(state==='All states'||state===x.state)).sort((a,b)=>sort==='Kind'?a.kind.localeCompare(b.kind):sort==='State'?a.state.localeCompare(b.state):0);document.querySelector('#resultCount').textContent=`${shown.length} titles${sort==='Default order'?'':` · sorted by ${sort.toLowerCase()}`}`;const box=document.querySelector('#libraryResults');box.className=display==='grid'?'library-grid':'table-wrap';if(!shown.length){box.className='empty';box.innerHTML='<h2>No matches</h2><p class="subtle">Change the filters.</p>';return}box.innerHTML=display==='grid'?shown.map(x=>`<button class="poster-button" data-select="${media.indexOf(x)}"><span class="poster" style="${art(x)}"></span><strong>${x.name}</strong><span class="subtle">${x.kind} · ${x.state}</span></button>`).join(''):`<table><thead><tr><th>Title</th><th>Kind</th><th>State</th><th>Year / extent</th></tr></thead><tbody>${shown.map(x=>`<tr class="${media.indexOf(x)===selected?'selected':''}"><td><div class="title-cell"><span class="tiny" style="${art(x)}"></span><button class="open-title" data-select="${media.indexOf(x)}"><strong>${x.name}</strong></button></div></td><td>${x.kind}</td><td><span class="state ${x.state==='Wanted'?'wanted':''}">${x.state}</span></td><td>${x.year}</td></tr>`).join('')}</tbody></table>`;wireSelection()}
function inspector(){const x=media[selected];document.querySelector('#inspectorName').textContent=x.name;document.querySelector('#inspectorKind').textContent=x.kind;document.querySelector('#inspectorMeta').textContent=`${x.year} · ${x.state}`;document.querySelector('#inspectorArt').style.backgroundImage=`url('../assets/${x.art}')`;document.querySelectorAll('[data-inspector]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.inspector===inspectorTab)));const body={versions:`<div class="detail-row"><div><strong>HD</strong><p class="subtle">Good enough · 18.4 GB</p></div><span class="state">Ready</span></div><div class="detail-row"><div><strong>4K</strong><p class="subtle">No file</p></div><span class="state wanted">Wanted</span></div>`,files:`<div class="detail-row"><div><strong>${x.name.replaceAll(' ','.')}.1080p.mkv</strong><p class="subtle">HEVC · English</p></div></div>`,history:`<div class="detail-row"><div><strong>Title added</strong><p class="subtle">Today · fictional event</p></div></div>`};document.querySelector('#inspectorContent').innerHTML=body[inspectorTab]}
function wireSelection(){document.querySelectorAll('[data-select]').forEach(el=>el.onclick=()=>{selected=Number(el.dataset.select);renderLibrary();inspector();const selectedButton=document.querySelector(`[data-select="${selected}"]`);if(innerWidth<=1200)openInspector(selected);else selectedButton?.focus()})}
function openInspector(key){document.body.classList.add('inspecting');document.querySelectorAll('.icon-rail,.view-sidebar,.shell').forEach(x=>x.inert=true);document.querySelector('#inspector')._focusKey=key;document.querySelector('#inspectorBack').focus()}
function closeInspector(){const key=document.querySelector('#inspector')._focusKey;document.body.classList.remove('inspecting');document.querySelectorAll('.icon-rail,.view-sidebar,.shell').forEach(x=>x.inert=false);(document.querySelector(`[data-select="${key}"]`)||main).focus()}
function show(dialog,trigger){dialog._trigger=trigger||document.activeElement;dialog.showModal();dialog.querySelector('button,input,select,textarea')?.focus()}function close(dialog){dialog.close()}function restoreDialogFocus(dialog){const target=dialog._trigger?.isConnected?dialog._trigger:main;target.focus()}function note(copy,trigger){document.querySelector('#confirmTitle').textContent='Review scope';document.querySelector('#confirmCopy').textContent=copy;document.querySelector('#confirmAction').hidden=true;show(document.querySelector('#confirmDialog'),trigger)}function confirmIt(title,copy,trigger,fn){document.querySelector('#confirmTitle').textContent=title;document.querySelector('#confirmCopy').textContent=copy;document.querySelector('#confirmAction').hidden=false;pending=fn;show(document.querySelector('#confirmDialog'),trigger)}
function navigate(next){page=next;render();main.focus();if(next==='search')document.querySelector('#titleQuery').focus()}
function wire(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{if(document.querySelector('#navDrawer').open)close(document.querySelector('#navDrawer'));navigate(b.dataset.page)});document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>note(b.dataset.note,b));document.querySelectorAll('[data-saved]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-saved]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('#stateFilter').value=['Ready','Wanted'].includes(b.dataset.saved)?b.dataset.saved:'All states';document.querySelector('#kindFilter').value=['Movies','Shows'].includes(b.dataset.saved)?b.dataset.saved:'All kinds';renderLibrary()});['titleQuery','kindFilter','stateFilter','groupFilter'].forEach(id=>document.querySelector('#'+id)?.addEventListener(id==='titleQuery'?'input':'change',renderLibrary));document.querySelector('#listMode')?.addEventListener('click',()=>{display='list';render()});document.querySelector('#gridMode')?.addEventListener('click',()=>{display='grid';render()});document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>{approveName=b.dataset.approve;document.querySelector('#approveTitle').textContent=`Approve ${approveName}`;show(document.querySelector('#approveDialog'),b)});document.querySelectorAll('[data-decline]').forEach(b=>b.onclick=()=>confirmIt(`Turn down ${b.dataset.decline}`,'Turn down this fictional ask?',b,()=>{settled[b.dataset.decline]='Turned down';render()}));document.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>{const remove=b.dataset.action==='Remove';confirmIt(`${b.dataset.action} ${b.dataset.job}`,remove?'Remove this fictional download job from the review? No media file is deleted and the installed app is not contacted.':'Turn down this release, remove its job, and search again? The installed app is not contacted.',b,()=>{const row=b.closest('.row');if(remove)row.remove();else{row.querySelector('h2').textContent=`${b.dataset.job} · Searching again`;row.querySelector('.progress i').style.width='0';row.querySelector('.subtle').textContent='Searching again'}})});document.querySelector('#useFile')?.addEventListener('click',e=>confirmIt('Use selected file',`Continue with ${document.querySelector('input[name=file]:checked').value}?`,e.currentTarget,()=>document.querySelector('#decision').innerHTML='<h2>File choice recorded in this fixture</h2>'));document.querySelector('#calendarFilter')?.addEventListener('change',e=>document.querySelectorAll('[data-kind]').forEach(x=>x.hidden=e.target.value!=='All kinds'&&x.dataset.kind!==e.target.value));document.querySelector('#historyQuery')?.addEventListener('input',e=>document.querySelectorAll('[data-history]').forEach(x=>x.hidden=!x.dataset.history.includes(e.target.value.toLowerCase())));document.querySelector('#settingsForm')?.addEventListener('submit',e=>{e.preventDefault();document.querySelector('#settingsStatus').textContent='Fixture saved, then tested. No linked app contacted.'})}
document.querySelectorAll('.icon-rail [data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));document.querySelector('#globalQuery').oninput=e=>{if(!['library','search'].includes(page))navigate('search');document.querySelector('#titleQuery').value=e.target.value;renderLibrary()};document.querySelectorAll('[data-inspector]').forEach(b=>b.onclick=()=>{inspectorTab=b.dataset.inspector;inspector()});document.querySelector('#keepUpdated').onchange=e=>note(`Keep up to date is ${e.target.checked?'on':'off'} for this fictional title.`,e.target);document.querySelector('#inspectorBack').onclick=closeInspector;document.querySelector('#menuButton').onclick=e=>show(document.querySelector('#navDrawer'),e.currentTarget);document.querySelector('.drawer-links').innerHTML=pages.map(x=>`<button data-page="${x}">${labels[x]}</button>`).join('');document.querySelector('#approveForm').onsubmit=e=>{e.preventDefault();settled[approveName]='Approved';close(document.querySelector('#approveDialog'));render()};document.querySelector('#confirmAction').onclick=()=>{pending?.();pending=null;close(document.querySelector('#confirmDialog'))};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(document.querySelector('#'+b.dataset.close)));document.querySelectorAll('dialog').forEach(d=>d.addEventListener('close',()=>queueMicrotask(()=>restoreDialogFocus(d))));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('inspecting')&&!document.querySelector('dialog[open]'))closeInspector();if(e.key==='Tab'&&document.body.classList.contains('inspecting')){const f=[...document.querySelector('#inspector').querySelectorAll('button,input')].filter(x=>!x.hidden);const first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});render();inspector();
</script></body></html>
