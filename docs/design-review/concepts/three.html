<dialog id="confirm" aria-labelledby="confirmtitle"><h2 id="confirmtitle"></h2><p id="confirmtext"></p><div class="actions"><button class="secondary" data-close>Cancel</button><button class="primary" id="confirmbutton">Continue</button></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script>
const titles=[{name:'The Glass Harbor',kind:'Movie',year:'2026',detail:'A quiet coast. A house full of unanswered questions.',state:'In library',position:'0% 0%',length:'1h 48m',genre:'Mystery'},{name:'A Map of Elsewhere',kind:'Movie',year:'2025',detail:'One traveller, a missing map, and the long way home.',state:'In library',position:'50% 0%',length:'2h 06m',genre:'Adventure'},{name:'Northbound',kind:'Show',year:'2026',detail:'Far from the city, a new beginning takes an unexpected turn.',state:'2 episodes missing',position:'100% 0%',length:'8 episodes',genre:'Drama'},{name:'After the Signal',kind:'Movie',year:'2026',detail:'The last transmission changes everything.',state:'Downloading',position:'0% 100%',length:'1h 56m',genre:'Science fiction'},{name:'Small Hours',kind:'Show',year:'2025',detail:'Six lives cross in a city that never quite sleeps.',state:'In library',position:'50% 100%',length:'6 episodes',genre:'Drama'},{name:'The Last Weather Station',kind:'Movie',year:'2024',detail:'At the edge of the world, every observation matters.',state:'In library',position:'100% 100%',length:'1h 42m',genre:'Thriller'}];
const main=document.querySelector('main'),activity=document.querySelector('#activity'),confirmDialog=document.querySelector('#confirm');let page='browse',featured=0,selected=0,filter='All',query='',jobs=[{id:1,title:3,progress:68,caption:'Downloading · 6.8 GB of 10 GB · 8 min left'},{id:2,title:2,progress:0,caption:'Waiting to import · season 1, episode 3'}],pending=null,timer;const openers=new WeakMap();
const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
function card(t,i){return `<button class="poster" data-title="${i}"><span class="cover" style="background-position:${t.position}">${t.state==='Downloading'?'<span class="badge">Downloading · 68%</span>':''}</span><strong>${esc(t.name)}</strong><small>${t.year} · ${t.kind}</small></button>`}
function rail(list=titles){return `<div class="rail">${list.map(t=>card(t,titles.indexOf(t))).join('')}</div>`}
function render(focus=true){document.querySelector('#profilemenu').hidden=true;document.querySelector('#profile').setAttribute('aria-expanded','false');document.querySelectorAll('[data-go]').forEach(b=>{if(b.closest('nav')){if(b.dataset.go===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')}});let t=titles[featured];
if(page==='browse'){main.innerHTML=`<section class="hero" aria-labelledby="featuredtitle"><div class="heroart" style="background-position:${t.position}"></div><div class="herocopy"><span class="eyebrow">From your library · Featured</span><h1 id="featuredtitle">${esc(t.name)}</h1><div class="meta"><span>${t.year}</span><span class="dot"></span><span>${t.genre}</span><span class="dot"></span><span>${t.length}</span></div><p>${t.detail}</p><div class="actions"><button class="primary" data-title="${featured}">View title</button><button class="secondary" data-action="activity">View activity</button></div></div><div class="heropages"><button data-feature="-1" aria-label="Previous featured title">‹</button><button data-feature="1" aria-label="Next featured title">›</button></div></section><section class="section"><div class="sectionhead"><h2>Recently added</h2><button data-go="search">See all ›</button></div>${rail()}</section><section class="section"><div class="sectionhead"><h2>A little further from home</h2><button data-go="collections">Collections ›</button></div><div class="spotlight"><button class="collection" data-collection="Adventure"><span class="ghostnumber" aria-hidden="true">01</span><span>PROPOSED VISUAL GROUP</span><strong>The long way home</strong><span>Adventure & exploration →</span></button><button class="collection" data-collection="Drama"><span class="ghostnumber" aria-hidden="true">02</span><span>PROPOSED VISUAL GROUP</span><strong>After dark</strong><span>Stories from the city →</span></button></div></section><section class="section"><div class="sectionhead"><h2>Shows to catch up on</h2></div>${rail(titles.filter(x=>x.kind==='Show'))}</section><footer class="footer">Six fictional titles. Your real media and installed app are never contacted.</footer>`}
else if(page==='search'){const list=titles.filter(t=>(filter==='All'||t.kind===filter||t.genre===filter)&&t.name.toLowerCase().includes(query.toLowerCase()));main.innerHTML=`<section class="page"><span class="eyebrow">Your collection</span><h1>Find your next story.</h1><label class="searchbox"><span aria-hidden="true">⌕</span><input id="query" aria-label="Search your library" placeholder="Search titles in your library" value="${esc(query)}" autocomplete="off"><button class="round" data-action="clear" aria-label="Clear search">×</button></label><div class="chips" aria-label="Media kind">${['All','Movie','Show'].map(x=>`<button data-filter="${x}" aria-pressed="${filter===x}">${x==='All'?'Everything':x+'s'}</button>`).join('')}</div><div aria-live="polite" id="results">${list.length?rail(list):'<div class="empty">No titles found. Try another name or clear your filters.<br><button class="secondary" data-action="reset">Reset search</button></div>'}</div></section>`}
else if(page==='title'){t=titles[selected];main.innerHTML=`<section class="titleview"><button class="back" data-go="browse">‹ Back to library</button><div class="titlelayout"><span class="cover" style="background-position:${t.position}" role="img" aria-label="Artwork for ${esc(t.name)}"></span><div><span class="eyebrow">${t.kind} · ${t.genre}</span><h1>${esc(t.name)}</h1><div class="meta">${t.year} · ${t.length}</div><p>${t.detail}</p><div class="facts"><div><strong>${t.state}</strong>Library state</div><div><strong>English</strong>Original language</div></div><h2 style="font-size:21px">Versions</h2><div class="version"><div><strong>HD · Original edition</strong><small>1080p · English audio</small></div><span class="state">${t.state}</span></div><div class="actions"><button class="primary" data-action="version">Manage version</button><button class="secondary" data-action="activity">Downloads</button></div><div class="file"><strong>Example file</strong>Review collection / ${esc(t.name)} (${t.year}) / ${esc(t.name)}.mkv<br>Fictional metadata. No real file is opened.</div></div></div></section>`}
else if(page==='collections'){main.innerHTML=`<section class="page"><span class="eyebrow">Proposed visual groups</span><h1>Collections</h1><p>Design-direction filters, not saved user-created collections.</p><section style="margin-top:40px"><h2>The long way home</h2>${rail([titles[1],titles[2],titles[5]])}</section><section><h2>After dark</h2>${rail([titles[4],titles[0]])}</section></section>`}
else{main.innerHTML=`<section class="page"><span class="eyebrow">Your library, your way</span><h1>Settings</h1><p>Downloader connection · fictional saved example</p><form id="settingsform" class="form"><label>Display name<input name="name" value="Home downloader" required maxlength="120"></label><label>Address<input name="address" value="https://downloader.example.invalid" type="url" required></label><p class="quiet">The real app tests the saved connection. This review demonstrates that order locally, without contacting an address.</p><div class="actions"><button type="submit" class="primary">Save and test example</button><button type="button" class="secondary" data-action="test">Test saved example</button></div><output id="saved" aria-live="polite"></output></form></section>`}
if(focus){main.focus();window.scrollTo(0,0)}}
function open(dialog,button){openers.set(dialog,button||document.activeElement);dialog.showModal()}
function notice(message){const n=document.querySelector('#toast');n.textContent=message;n.hidden=false;clearTimeout(timer);timer=setTimeout(()=>n.hidden=true,5000)}
function drawJobs(){document.querySelector('#jobs').innerHTML=jobs.length?jobs.map(j=>{const t=titles[j.title];return `<article class="download"><div class="downloadtop"><span class="thumb" style="background-position:${t.position}"></span><div class="downloadtitle"><strong>${t.name}</strong><small>${j.caption}</small></div><span class="quiet">${j.progress?j.progress+'%':'Ready'}</span></div><progress max="100" value="${j.progress}" aria-label="${esc(t.name)} progress"></progress><div class="actions"><button class="secondary" data-job="${j.id}" data-mode="failed">Mark failed</button><button class="secondary" data-job="${j.id}" data-mode="remove">Remove</button></div></article>`}).join(''):'<div class="empty">All clear. No downloads in this review.</div>'}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){page=b.dataset.go;if(page==='search'){filter='All';query=''}render();return}if(b.dataset.title!==undefined){selected=Number(b.dataset.title);page='title';render();return}if(b.dataset.feature){featured=(featured+Number(b.dataset.feature)+titles.length)%titles.length;render(false);document.querySelector(`[data-feature="${b.dataset.feature}"]`).focus();return}if(b.dataset.collection){filter=b.dataset.collection;page='search';query='';render();return}if(b.dataset.filter){filter=b.dataset.filter;render(false);document.querySelector(`[data-filter="${filter}"]`).focus();return}if(b.hasAttribute('data-close')){b.closest('dialog').close();return}if(b.id==='profile'){const menu=document.querySelector('#profilemenu');menu.hidden=!menu.hidden;b.setAttribute('aria-expanded',String(!menu.hidden));if(!menu.hidden)menu.querySelector('button').focus();return}if(b.dataset.job){const id=Number(b.dataset.job),failed=b.dataset.mode==='failed';pending=()=>{jobs=jobs.filter(j=>j.id!==id);drawJobs();notice(failed?'Example marked failed. The real app turns down the release and searches again.':'Example removed from the review queue.')};document.querySelector('#confirmtitle').textContent=failed?'Mark this download failed?':'Remove this download?';document.querySelector('#confirmtext').textContent=failed?'The real app turns down this release, removes the job and searches for another release. This example changes only this tab.':'The real app presents removal choices before removing a job. This review removes only its fictional row; it never deletes media.';document.querySelector('#confirmbutton').textContent=failed?'Mark failed':'Remove example';open(confirmDialog,b);return}if(b.id==='confirmbutton'){pending?.();confirmDialog.close();return}switch(b.dataset.action){case'activity':drawJobs();open(activity,b);break;case'scope':notice('Cinema direction only: fictional titles, local interactions, no media playback or API access.');break;case'version':pending=()=>notice('Example version retained. Product integration preserves the existing version editor.');document.querySelector('#confirmtitle').textContent='HD · Original edition';document.querySelector('#confirmtext').textContent='This version is managed independently. The real version editor keeps its existing pick rules, release selection and file controls. This review makes no API change.';document.querySelector('#confirmbutton').textContent='Done';open(confirmDialog,b);break;case'clear':query='';render(false);document.querySelector('#query').focus();break;case'reset':filter='All';query='';render(false);document.querySelector('#query').focus();break;case'test':document.querySelector('#saved').textContent='Saved fictional connection tested. No network request was made.';break}});
document.addEventListener('input',e=>{if(e.target.id!=='query')return;query=e.target.value;const start=e.target.selectionStart;render(false);const q=document.querySelector('#query');q.focus();q.setSelectionRange(start,start)});
document.addEventListener('submit',e=>{if(e.target.id!=='settingsform')return;e.preventDefault();document.querySelector('#saved').textContent='Example saved, then its saved connection tested. Changes exist only in this tab.'});
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('close',()=>{const trigger=openers.get(d);if(trigger?.isConnected&&!trigger.closest('dialog:not([open])'))trigger.focus();else if(activity.open)activity.querySelector('[data-close]').focus();else document.querySelector('.brand').focus()}));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.querySelector('#profilemenu').hidden){document.querySelector('#profilemenu').hidden=true;document.querySelector('#profile').setAttribute('aria-expanded','false');document.querySelector('#profile').focus()}});
document.addEventListener('click',e=>{if(!e.target.closest('.profile')){document.querySelector('#profilemenu').hidden=true;document.querySelector('#profile').setAttribute('aria-expanded','false')}});
render(false);
</script>
</body>
</html>
