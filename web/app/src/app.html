<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="dark light" />
		<meta name="referrer" content="no-referrer" />
		<link rel="preconnect" href="https://image.tmdb.org" />
		<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="apple-touch-icon" href="/brand/apple-touch-icon-180.png" />
		<title>HolyArrs</title>
		<script>
			try {
				var requested = new URLSearchParams(location.search).get('theme');
				var t = requested === 'light' || requested === 'dark' ? requested : localStorage.getItem('holyarrs-theme');
				if (requested === 'light' || requested === 'dark') localStorage.setItem('holyarrs-theme', t);
				if (requested === 'system') localStorage.removeItem('holyarrs-theme');
				if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
		%sveltekit.head%
		<style>
			#hl{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0b0b0c;transition:opacity .25s ease-out}
			[data-theme='light'] #hl{background:#f5f5f7}
			#hl[hidden]{display:none}
			#hlt{margin:0;font:500 15px/1.3 system-ui,sans-serif;color:#a1a1a6;min-height:1.3em}
			#hl svg{width:104px;height:104px;overflow:visible}
			#hl .r,#hl .m{transform-box:view-box;transform-origin:50px 50px}
			#hl .r{animation:hlr 1.17s linear infinite}
			#hl .m{animation:hls 2.6s ease-in-out infinite}
			#hl.nav{background:rgba(0,0,0,.32);animation:hlf .2s}
			#hl.nav svg{width:56px;height:56px}
			#hl.out{opacity:0;pointer-events:none}
			@keyframes hlr{to{transform:rotate(360deg)}}
			@keyframes hls{0%,100%{opacity:.8}50%{opacity:1}}
			@keyframes hlf{from{opacity:0}}
			@media (prefers-reduced-motion:reduce){#hl .r{display:none}#hl .m{animation:none}}
		</style>

	</head>
	<body data-sveltekit-preload-data="hover">
		<noscript>HolyArrs needs JavaScript. Movie data from TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB.</noscript>
		<div style="display: contents">%sveltekit.body%</div>
		<div id="hl" role="status" aria-label="HolyArrs is loading">
			<svg viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="hlc"><rect x="17.5" y="17.5" width="65" height="65" rx="4" transform="rotate(45 50 50)" /></clipPath></defs><circle cx="50" cy="50" r="46" fill="none" stroke="#7c7c80" stroke-opacity=".3" stroke-width="1.6" /><circle class="r" cx="50" cy="50" r="46" fill="none" stroke="#ff453a" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="60 229" /><g class="m"><g transform="translate(14 14) scale(.72)"><rect x="17.5" y="17.5" width="65" height="65" rx="4" transform="rotate(45 50 50)" fill="none" stroke="#3a3d44" stroke-width="2.2" /><g clip-path="url(#hlc)"><rect width="100" height="100" fill="#1c1d21" /><path d="M50 0C42 18 46 32 58 41C70 50 66 70 54 100L110 100L110 0Z" fill="#f23a2e" /><path d="M50 0C42 18 46 32 58 41C70 50 66 70 54 100L110 100L110 0Z" fill="#55585e" transform="rotate(180 50 50)" /></g><path d="M50 26.8Q54.5 44.3 72 48.8Q54.5 53.3 50 70.8Q45.5 53.3 28 48.8Q45.5 44.3 50 26.8Z" fill="#fff" /></g></g></svg>
			<p id="hlt"></p>
		</div>
	</body>
</html>
