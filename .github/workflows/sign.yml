name: HolyArrs - Sign

# Signs a published Docker Hub image and records how it was built:
# a keyless cosign signature, a build provenance attestation and an SBOM.
# The same files are added to the version's GitHub release.
# Runs as the last step of a release; a hand start signs a version again.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: A published version (for example 1.0.2)
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: holyarrs/holyarrs
  VERSION: ${{ inputs.version }}

jobs:
  sign:
    name: Sign and attest the image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Find the image digest
        id: image
        run: |
          case "$VERSION" in (*[!0-9.]*|'') echo "::error::not a version: $VERSION"; exit 1;; esac
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          case "$digest" in (sha256:*) ;; (*) echo "::error::no digest for $IMAGE:$VERSION"; exit 1;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes --bundle "holyarrs-$VERSION.sigstore.json" "docker.io/$IMAGE@$DIGEST"

      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Make the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: holyarrs-${{ env.VERSION }}.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: index.docker.io/${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: holyarrs-${{ env.VERSION }}.sbom.spdx.json
          push-to-registry: true

      - name: Add the files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "holyarrs-$VERSION.intoto.jsonl"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "holyarrs-$VERSION.intoto.jsonl" "holyarrs-$VERSION.sigstore.json" "holyarrs-$VERSION.sbom.spdx.json" --clobber
          else
            echo "::notice::no GitHub release named $VERSION; files not attached"
          fi
