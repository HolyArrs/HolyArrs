name: HolyArrs - Release
run-name: ${{ inputs.version || github.ref_name }}

# Starts when a version tag (1.2.3) is pushed. Tests run on the maintainer's
# machine before the tag is pushed.
#
# The multi-arch image goes to Docker Hub. The portable archives, the source
# archive and SHA256SUMS are attached to the GitHub release.
#
# Repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  # Hand start: rebuild the Docker Hub image for a version without a tag or
  # GitHub release (used for 1.0.0, whose GitHub tag cannot be reused).
  workflow_dispatch:
    inputs:
      version:
        description: Version, the same as the VERSION file (for example 1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: holyarrs-release
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: holyarrs/holyarrs
  DOCKER_PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check the version matches VERSION
        run: |
          file="$(tr -d '[:space:]' < VERSION)"
          [ "$file" = "$VERSION" ] || { echo "::error::VERSION says $file, not $VERSION."; exit 1; }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The same scan as the Build workflow, before anything is pushed.
      - name: Build for the scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          build-args: VERSION=${{ env.VERSION }}
          tags: holyarrs-scan:local
          cache-from: type=gha

      - name: Scan (fail on fixable CRITICAL or HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: holyarrs-scan:local
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ env.VERSION }}
            ${{ env.DOCKERHUB_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-binaries:
    name: Build portable binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Fill the Go module cache
        run: go mod download all

      - name: Install the web dependencies
        run: npm ci --prefix app/frontend --ignore-scripts --no-audit --no-fund

      # package.py builds in a pinned image with networking off, so the image
      # must already be in the local store (it never pulls).
      - name: Pull the pinned builder image
        run: docker pull "$(python3 -c 'import deploy.release.package as package; print(package.GO_IMAGE)')"

      - name: Build the archives
        run: |
          python3 deploy/release/package.py \
            --ref "$GITHUB_SHA" \
            --version "$VERSION" \
            --output "$RUNNER_TEMP/portable" \
            --web-node-modules app/frontend/node_modules \
            --module-cache "$(go env GOMODCACHE)"

      - name: Keep the archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: holyarrs-portable
          path: ${{ runner.temp }}/portable/
          if-no-files-found: error
          retention-days: 5

  update-dockerhub-description:
    name: Update Docker Hub description
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Docker Hub drops <picture> and stacks images; hub_readme.py makes a copy that reads well there.
      - name: Make the Docker Hub copy of the README
        run: python3 deploy/release/hub_readme.py README.md > "$RUNNER_TEMP/hub-readme.md"

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          readme-filepath: ${{ runner.temp }}/hub-readme.md

  publish-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push, build-binaries]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: holyarrs-portable
          path: ${{ runner.temp }}/portable

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 deploy/release/changelog_notes.py "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/portable/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  sign:
    name: Sign
    needs: publish-github-release
    if: github.event_name == 'push'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/sign.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
