name: HolyArrs - Synology package
run-name: ${{ inputs.version || github.event.workflow_run.head_branch }}

# Builds the experimental Synology package (.spk) for a published version and
# adds it to that version's GitHub release.
#
# It is its own workflow on purpose. It starts only after HolyArrs - Release
# has finished well, so a failure here fails this run alone and never the
# release. The program inside each package is copied out of the Docker Hub
# image for that version; nothing is compiled and no secrets are used.

on:
  workflow_run:
    workflows: ['HolyArrs - Release']
    types: [completed]
  # Hand start: build the packages for a version again.
  workflow_dispatch:
    inputs:
      version:
        description: A published version with a GitHub release (for example 1.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: holyarrs-synology-${{ inputs.version || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: holyarrs/holyarrs
  VERSION: ${{ inputs.version || github.event.workflow_run.head_branch }}

jobs:
  package:
    name: Build and attach the Synology packages
    # After a release: only a tag-started run that ended well. A hand-started
    # release makes no GitHub release, so there is nothing to attach to.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check the version
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::not a version: $VERSION"; exit 1; }

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Test the build script
        run: python3 -m unittest deploy/synology/test_build.py

      - name: Build and check the packages
        run: python3 deploy/synology/build.py --version "$VERSION" --image "$DOCKERHUB_IMAGE" --arch all --output dist

      - name: Add the files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$VERSION" >/dev/null || { echo "::error::no GitHub release named $VERSION"; exit 1; }
          gh release upload "$VERSION" dist/holyarrs-"$VERSION"-*.spk "dist/holyarrs-$VERSION-synology-SHA256SUMS" --clobber
