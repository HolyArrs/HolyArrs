name: ci
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.2"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Built app in web/dist matches the source
        run: git diff --exit-code -- ../dist
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, arm, "386"]
    env:
      CGO_ENABLED: "0"
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.2"
      - name: Set up QEMU for non-native tests
        if: matrix.goarch != 'amd64' && matrix.goarch != '386'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - run: go build ./...
      - run: go vet ./...
      - run: go test -timeout 60m ./...
  image-version:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: holyarrs-ci-version:${{ github.run_id }}-${{ github.run_attempt }}
      CONTAINER: holyarrs-ci-version-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set the development version for this source
        run: echo "CANDIDATE_VERSION=0.0.0-dev+g${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      - name: Build the reviewed development image
        run: docker build --build-arg VERSION="$CANDIDATE_VERSION" --build-arg GOMAXPROCS=1 --build-arg GOFLAGS=-p=1 --tag "$IMAGE" .
      - name: Verify the image label and running binary version
        run: |
          set -o pipefail
          label="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$IMAGE")"
          if [[ "$label" != "$CANDIDATE_VERSION" ]]; then
            echo "OCI version label mismatch: got $label"
            exit 1
          fi

          docker run --detach --name "$CONTAINER" --network none "$IMAGE" >/dev/null
          log_file="$RUNNER_TEMP/image-version.log"
          found=0
          for _ in {1..60}; do
            docker logs "$CONTAINER" 2>&1 | sed -E 's/(auth: first run: setup code) [^ ]+/\1 [hidden]/g' > "$log_file"
            if grep -Fq "holyarrs $CANDIDATE_VERSION:" "$log_file"; then
              found=1
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$CONTAINER")" != "true" ]]; then
              break
            fi
            sleep 1
          done
          if [[ "$found" != "1" ]]; then
            echo "The running image did not report the reviewed development version."
            cat "$log_file"
            exit 1
          fi
          echo "OCI label and running binary report $CANDIDATE_VERSION."
      - name: Remove the version-check image and container
        if: always()
        run: |
          docker rm --force --volumes "$CONTAINER" 2>/dev/null || true
          docker image rm "$IMAGE" 2>/dev/null || true


  faults-and-memory:
    # 3.7.10 to 3.7.12: the fault runs, the crash-to-sign-in time, the
    # memory runs (all parts on next to Movies and Shows only), the API
    # contract and the downloader suite. Their numbers go to the job
    # summary. Pass lines: the process's median crash-to-sign-in time
    # under 2 s, and each memory run under decision 0002's limits (250 MB
    # idle, 500 MB peak resident).
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.2"
      - name: API spec matches the code (contract)
        run: go test -count=1 -run '^TestOpenAPIGenerated$' ./internal/api
      - name: Every route checks its API key scope
        run: go test -count=1 -run 'Scope' ./internal/auth
      - name: Downloader suite (qBittorrent, SABnzbd, the made-up third engine)
        run: go test -count=1 -run '^TestDownloaderConformance$' -v ./internal/downloader
      - name: Fault runs (a crash in each loop, a slow write, bad outside services, a pass past its deadline)
        env:
          HOLYARRS_FAULT_OUT: ${{ runner.temp }}/faults.md
        run: |
          go test -count=1 -run '^TestFault|^TestCrashInEveryLoopIsContained$' -v ./cmd/holyarrs
          { echo "### Fault runs: sign-in, Library, backup"; echo "| run | sign-in | Library | backup |"; echo "|---|---|---|---|"; grep -v 'after hanging' "$HOLYARRS_FAULT_OUT"; echo; echo "| link | state | reason |"; echo "|---|---|---|"; grep 'after hanging' "$HOLYARRS_FAULT_OUT"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Crash to sign-in page
        env:
          HOLYARRS_RESTART_TIMING: "1"
          HOLYARRS_RESTART_TIMING_OUT: ${{ runner.temp }}/restart.txt
        run: |
          go test -count=1 -run '^TestCrashRestartTime$' -v ./cmd/holyarrs
          { echo "### Crash to sign-in page"; cat "$HOLYARRS_RESTART_TIMING_OUT"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Memory with all parts on and with Movies and Shows only
        env:
          HOLYARRS_MEMORY: "1"
          HOLYARRS_MEMORY_OUT: ${{ runner.temp }}/memory.md
        run: |
          go test -count=1 -run '^TestMemoryPartsRuns$' -v -timeout 30m ./cmd/holyarrs
          { echo "### Memory"; cat "$HOLYARRS_MEMORY_OUT"; } >> "$GITHUB_STEP_SUMMARY"
  combined-scale:
    # Decision 0002's complete workload on the arm64 stand-in: 5,000
    # Movies, 5,000 Shows / 50,000 Episodes, 20 feeds, a real stand-in
    # media rescan and 10 live-stream clients. The harness measures fixture
    # construction separately, then requires 30 idle minutes under the
    # unchanged 250 MB idle / 500 MB peak and zero-write limits.
    runs-on: ubuntu-latest
    # The test binary has a 75-minute deadline; this includes setup and
    # artifact-upload overhead outside that measured test process.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.2"
      - name: Set up QEMU for the arm64 stand-in
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - name: Run the combined arm64 scale check
        id: scale
        continue-on-error: true
        run: bash scripts/scale-check.sh "$RUNNER_TEMP/scale-combined"
      - name: Save combined scale evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: combined-scale-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/scale-combined/scale-combined.log
            ${{ runner.temp }}/scale-combined/scale-results.jsonl
            ${{ runner.temp }}/scale-combined/scale-exit-code.txt
      - name: Enforce the combined scale result
        if: always()
        run: |
          status_file="$RUNNER_TEMP/scale-combined/scale-exit-code.txt"
          if [[ ! -f "$status_file" ]]; then
            echo "The combined scale check did not produce an exit status."
            exit 1
          fi
          status="$(<"$status_file")"
          if [[ "$status" != "0" ]]; then
            echo "The combined scale check exited with status $status."
            exit "$status"
          fi
  race:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.2"
      - run: go test -race -timeout 40m ./...
