name: HolyArrs - Linux downloads
run-name: ${{ inputs.version || github.event.workflow_run.head_branch }}

# Builds the plain Linux downloads (amd64, arm64, armv7; no Docker needed) for
# a published version and adds them, with a SHA256SUMS file, to that version's
# GitHub release.
#
# It is its own workflow on purpose. It starts only after HolyArrs - Release
# has finished well, so a failure here fails this run alone and never the
# release. The web app is built in the same pinned Node image as
# deploy/Dockerfile and the program with the same go build flags (see
# deploy/release/linux_package.py). No secrets are used.

on:
  workflow_run:
    workflows: ['HolyArrs - Release']
    types: [completed]
  # Hand start: build the downloads for a version again.
  workflow_dispatch:
    inputs:
      version:
        description: A published version with a GitHub release (for example 1.1.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: holyarrs-linux-${{ inputs.version || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || github.event.workflow_run.head_branch }}
  # The same image as the web stage in deploy/Dockerfile.
  NODE_IMAGE: node:24.22.1-trixie-slim@sha256:43b9ba1142b8dcf33fa8f922ca1be85714adc444e0586c7cf7726daaeabc1bea

jobs:
  package:
    name: Build and attach the Linux downloads
    # After a release: only a tag-started run that ended well. A hand-started
    # release makes no GitHub release, so there is nothing to attach to.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check the version
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::not a version: $VERSION"; exit 1; }

      # The release's own tag, not whatever the default branch holds now.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.VERSION }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test the packaging script
        run: python3 -m unittest deploy/release/tests/test_linux_package.py

      - name: Build the web app
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/app/frontend:/web" -w /web "$NODE_IMAGE" \
            sh -c 'npm ci --ignore-scripts --no-audit --no-fund && npm run build'

      - name: Build the archives
        run: python3 deploy/release/linux_package.py --version "$VERSION" --output dist --prebuilt-web --bare

      - name: Keep the files for the attest job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-downloads-${{ env.VERSION }}
          path: |
            dist/holyarrs_${{ env.VERSION }}_linux_*
            dist/SHA256SUMS
          retention-days: 7

      - name: Add the files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$VERSION" >/dev/null || { echo "::error::no GitHub release named $VERSION"; exit 1; }
          gh release upload "$VERSION" dist/holyarrs_"$VERSION"_linux_* dist/SHA256SUMS --clobber

  # Its own job, so the build above (which runs npm) never holds a token that
  # can make attestations.
  provenance:
    name: Attest the Linux downloads
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the SBOM goes on the release
      id-token: write
      attestations: write
    steps:
      # The files the build job made, not whatever the release holds now.
      - name: Get the built files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-downloads-${{ env.VERSION }}
          path: dist

      - name: Check the release holds exactly these files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c --strict SHA256SUMS)
          mkdir released
          gh release download "$VERSION" --dir released --pattern "holyarrs_${VERSION}_linux_*" --pattern SHA256SUMS
          cmp dist/SHA256SUMS released/SHA256SUMS
          (cd released && sha256sum -c --strict SHA256SUMS)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Make the SBOM of the programs
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist
          format: spdx-json
          output-file: holyarrs-${{ env.VERSION }}-linux.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: holyarrs-${{ env.VERSION }}-linux.sbom.spdx.json

      - name: Add the SBOM to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$VERSION" "holyarrs-$VERSION-linux.sbom.spdx.json" --clobber
