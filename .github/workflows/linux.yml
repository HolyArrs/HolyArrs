name: HolyArrs - Linux downloads
run-name: ${{ inputs.version || github.event.workflow_run.head_branch }}

# Builds the plain Linux downloads (amd64, arm64, armv7; no Docker needed) for
# a published version and adds them, with a SHA256SUMS file, to that version's
# GitHub release.
#
# It is its own workflow on purpose. It starts only after HolyArrs - Release
# has finished well, so a failure here fails this run alone and never the
# release. The web app is built in the same pinned Node image as
# deploy/Dockerfile and the program with the same go build flags (see
# deploy/release/linux_package.py). No secrets are used.

on:
  workflow_run:
    workflows: ['HolyArrs - Release']
    types: [completed]
  # Hand start: build the downloads for a version again.
  workflow_dispatch:
    inputs:
      version:
        description: A published version with a GitHub release (for example 1.1.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: holyarrs-linux-${{ inputs.version || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || github.event.workflow_run.head_branch }}
  # The same image as the web stage in deploy/Dockerfile.
  NODE_IMAGE: node:24.22.1-trixie-slim@sha256:43b9ba1142b8dcf33fa8f922ca1be85714adc444e0586c7cf7726daaeabc1bea

jobs:
  package:
    name: Build and attach the Linux downloads
    # After a release: only a tag-started run that ended well. A hand-started
    # release makes no GitHub release, so there is nothing to attach to.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check the version
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::not a version: $VERSION"; exit 1; }

      # The release's own tag, not whatever the default branch holds now.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.VERSION }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test the packaging script
        run: python3 -m unittest deploy/release/tests/test_linux_package.py

      - name: Build the web app
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e HOLYARRS_LANGUAGES_PLAIN=1 \
            -v "$PWD/app/frontend:/web" -w /web "$NODE_IMAGE" \
            sh -c 'npm ci --ignore-scripts --no-audit --no-fund && npm run build'

      - name: Build the archives
        run: python3 deploy/release/linux_package.py --version "$VERSION" --output dist --prebuilt-web

      - name: Add the files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$VERSION" >/dev/null || { echo "::error::no GitHub release named $VERSION"; exit 1; }
          gh release upload "$VERSION" dist/holyarrs_"$VERSION"_linux_*.tar.gz dist/SHA256SUMS --clobber
