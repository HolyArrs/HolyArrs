name: HolyArrs - CLA

# Our own CLA check, posted by HolyArrs Bot.
# A first-time contributor is asked to agree to .github/CLA.md by replying with
# one exact sentence. Agreements are kept in signatures.json on the
# cla-signatures branch, so main is never written to. The pull request's code
# is never checked out or run.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]
  # Run it by hand for a pull request opened before this check existed.
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request }}
  cancel-in-progress: false

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    steps:
      - name: Sign in as HolyArrs Bot
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.HOLYARRS_BOT_APP_ID }}
          private-key: ${{ secrets.HOLYARRS_BOT_PRIVATE_KEY }}

      - name: Check or record the agreement
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.bot.outputs.token }}
          script: |
            const SENTENCE = 'I have read the CLA and I agree to it.';
            const BRANCH = 'cla-signatures';
            const FILE = 'signatures.json';
            const MARK = '<!-- holyarrs-cla -->';
            const CONTEXT = 'CLA';
            const MAINTAINERS = ['coderluii'];
            const doc = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/.github/CLA.md`;
            const { owner, repo } = context.repo;

            const number = context.payload.pull_request?.number ?? context.payload.issue?.number ?? Number(context.payload.inputs.pull_request);
            const pr = (await github.rest.pulls.get({ owner, repo, pull_number: number })).data;
            const author = pr.user.login;
            const sha = pr.head.sha;
            const status = (state, description) =>
              github.rest.repos.createCommitStatus({ owner, repo, sha, state, context: CONTEXT, description, target_url: doc });

            // Everyone who wrote a commit here must agree, not only the opener.
            // Maintainers and bots are covered without signing.
            const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: number });
            const people = new Map([[author.toLowerCase(), author]]);
            const unlinked = new Set();
            for (const c of commits) {
              for (const who of [c.author, c.committer]) {
                if (who?.login && who.type !== 'Bot' && who.login !== 'web-flow') people.set(who.login.toLowerCase(), who.login);
              }
              if (!c.author?.login) unlinked.add(c.commit.author?.name || 'unknown');
            }
            for (const m of MAINTAINERS) people.delete(m);
            if (pr.user.type === 'Bot') people.delete(author.toLowerCase());

            // Read the agreements (the branch and file are made on first use).
            let signatures = [], fileSha;
            try {
              const f = (await github.rest.repos.getContent({ owner, repo, path: FILE, ref: BRANCH })).data;
              signatures = JSON.parse(Buffer.from(f.content, 'base64').toString('utf8'));
              fileSha = f.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            const signed = (login) => signatures.some((s) => s.login.toLowerCase() === login.toLowerCase());
            const same = (a, b) => a.trim().replace(/[.!\s]+$/, '').toLowerCase() === b.replace(/[.!\s]+$/, '').toLowerCase();

            // The author replied with the exact sentence: record it once.
            const comment = context.payload.comment;
            const signer = comment && people.get(comment.user.login.toLowerCase());
            if (signer && same(comment.body, SENTENCE) && !signed(signer)) {
              try {
                await github.rest.git.getRef({ owner, repo, ref: `heads/${BRANCH}` });
              } catch (e) {
                if (e.status !== 404) throw e;
                const main = (await github.rest.git.getRef({ owner, repo, ref: `heads/${pr.base.ref}` })).data;
                await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${BRANCH}`, sha: main.object.sha });
              }
              signatures.push({ login: signer, id: comment.user.id, pull_request: number, comment: comment.html_url, signed_at: comment.created_at });
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, branch: BRANCH, path: FILE, sha: fileSha,
                message: `CLA: ${signer} agreed in #${number}`,
                content: Buffer.from(JSON.stringify(signatures, null, 2) + '\n').toString('base64'),
              });
              await github.rest.issues.createComment({ owner, repo, issue_number: number,
                body: `${MARK}\nThanks @${signer}, your agreement to the [CLA](${doc}) is recorded. You won't be asked again.` });
            }

            const waiting = [...people.values()].filter((p) => !signed(p));
            if (!waiting.length && !unlinked.size) {
              await status('success', people.size ? 'Everyone here agreed to the CLA' : 'Nothing to agree to: maintainer or bot');
              return;
            }

            // Not everyone has agreed: keep the check red, and ask each person once,
            // even when their commit arrives later.
            await status('failure', unlinked.size && !waiting.length
              ? 'A commit is not linked to a GitHub account'
              : `Waiting for ${waiting.map((p) => '@' + p).join(', ')} to agree to the CLA`.slice(0, 139));
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number });
            const askMark = (p) => `<!-- holyarrs-cla-ask:${p.toLowerCase()} -->`;
            const toAsk = waiting.filter((p) => !comments.some((c) => c.body.includes(askMark(p))));
            const unlinkedMark = '<!-- holyarrs-cla-unlinked -->';
            const tellUnlinked = unlinked.size && !comments.some((c) => c.body.includes(unlinkedMark));
            if (toAsk.length || tellUnlinked) {
              const parts = [`${MARK}${toAsk.map(askMark).join('')}${tellUnlinked ? unlinkedMark : ''}`];
              if (toAsk.length) {
                parts.push(
                  `Thanks for this, ${toAsk.map((p) => '@' + p).join(' ')}! Before it can be merged, please read the HolyArrs ` +
                  `[contributor licence agreement](${doc}). You keep the copyright to your work; it lets HolyArrs ` +
                  `be offered under the AGPL and a commercial licence, and anything merged stays available under the AGPL.`,
                  `If you agree, reply to this pull request with this line (you only do this once):`,
                  '```\n' + SENTENCE + '\n```');
              }
              if (tellUnlinked) {
                parts.push(`Some commits use an email that isn't linked to a GitHub account (${[...unlinked].join(', ')}). ` +
                  'Add that email to your GitHub account, or redo those commits with your GitHub email, so they can be checked.');
              }
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body: parts.join('\n\n') });
            }
