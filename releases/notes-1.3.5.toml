  "Fixed: staff can change a show's only Version. (#796)",
  "Fixed: Show settings say Kept in part when some is kept. (#927)",
  "Fixed: the empty season note fits on one line. (#928)",
  "Fixed: Calendar jumps back to the current day again. (#929)",
]
Music = [
  "Fixed: found music files match after an artist refresh. (#735)",
  "Fixed: album folders like \"5_55 [FLAC 24-96]\" match their album. (#898)",
  "Fixed: Import by hand can pick the album's Pressing. (#777)",
]
