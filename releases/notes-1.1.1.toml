  "Import a library has the Library's four views and big posters. (#324)",
  "Library stats sits in the Library menu. (#321)",
  "Fixed: Posters view stays light in big libraries, Safari too. (#328)",
  "Fixed: Rename files no longer reads every file first. (#332)",
  "Fixed: Episodes count as missing only after they air. (#320)",
  "Fixed: Movies under a translated name import; by-hand import can replace files. (#308)",
]
