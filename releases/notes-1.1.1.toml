  "Fixed: A grab that never reaches a Downloader says so, never Sent. (#310)",
  "Fixed: SABnzbd downloads import with the episodes they were grabbed for. (#312)",
  "Fixed: A path pair with the same folder twice gets a note. (#265)",
  "Fixed: A torrent the client already holds is followed when picked. (#322)",
