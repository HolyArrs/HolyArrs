[[highlights]]
line = "Import files by hand right from the Library Add menu."
issues = [692]
shot = "Library Add menu open with Import files by hand"

[[highlights]]
line = "Movie files are checked before import: length, video and audio."
issues = [611]
shot = "An import held back because the play length doesn't match"

[[highlights]]
line = "Plugins can open a site's bot check for you."
issues = [865, 918]
shot = "A bot-check plugin with the owner-host box filled in"

[groups]
Library = [
  "Delete a single movie file from the Library tab. (#821)",
  "Import a library keeps going with the page closed. (#712)",
  "Fixed: Rescan commands rescan the title, or the whole Library. (#808)",
  "Fixed: shows with hundreds of episodes on a network share now import. (#682)",
  "Fixed: a show no longer takes another show's picture or episodes. (#342)",
  "Fixed: feed checks no longer time out on big libraries. (#747)",
]
Downloads = [
  "Pick rules get an SDR 4K trait and catch more AI upscales. (#610)",
  "Pick anyway on a season search takes releases named for the show. (#764)",
  "Fixed: SABnzbd speed goes only to jobs that are downloading. (#838)",
  "Fixed: empty Usenet job folders are deleted after a move import. (#724)",
  "Fixed: imports retry when files from a remote downloader arrive late. (#829)",
  "Fixed: qBittorrent works behind proxies that compress answers, like qui. (#846)",
  "Fixed: DUAL or MULTi names now say audio is checked at import. (#797)",
  "Fixed: German DL keeps the original language in imported Pick rules. (#858)",
  "Fixed: MULTi releases without your language are skipped before download. (#750)",
  "Fixed: \"amp\" in a release name matches \"&\". (#762)",
  "Fixed: anime names with alt-titles or [Group][Title][Episode] read right. (#763)",
  "Fixed: MKV audio with no language tag is read as English. (#850)",
]
Indexers = [
  "YTS is built in as a movie search and feed. (#817)",
  "Titlovi joins the subtitle sites. (#688)",
  "Fixed: IPTorrents sizes with odd spaces are read right. (#833)",
]
Accounts = [
  "The owner and an API key can come from files at start. (#660)",
  "Fixed: single sign-on started from another address goes through. (#708)",
  "Fixed: an expired sign-in goes to sign-in, not stuck on Reconnecting. (#793)",
]
Alerts = [
  "Discord Alerts come as one card with the poster, and mark upgrades. (#733)",
  "The Alerts panel shows an alert's full text. (#852)",
  "Library alerts open their title; search alerts name show and episode. (#830)",
  "Fixed: only warnings and errors light the Settings dot. (#786)",
]
Plugins = [
  "A plugin can bring its own download type. (#864)",
  "A plugin can list and remove its own links. (#854)",
  "The approve screen shows the remote-access warning. (#699)",
  "The No file lock tag explains what it means. (#698)",
  "Download counts show on first view and on Language Packs. (#851)",
  "Fixed: plugin limit labels stay whole and boxes stay on one line. (#862)",
]
Import = [
  "A movie in a 1080p and a 4K Radarr becomes one title. (#648)",
  "Files keep scene name and group, and score with the original language. (#783)",
  "One Source per site when Prowlarr, Sonarr and Radarr are imported. (#669)",
  "Naming comes over with the Radarr-style words. (#857)",
  "Fixed: the report says tags stay behind, not that HolyArrs has none. (#672)",
  "Fixed: forgetting saved keys while HolyArrs runs now says how. (#676)",
  "Fixed: an empty show folder no longer breaks an import. (#845)",
]
Requests = [
  "Approved anime can go to its own folder. (#855)",
  "Fixed: Back keeps you on the Explore or New & Popular tab. (#753)",
  "Fixed: each watch link shows once when a server is added twice. (#717)",
]
Movies = [
  "Removing a copy's protection asks in the app's own dialog. (#150)",
]
Shows = [
  "Show settings get a Future seasons only option. (#720) (#721)",
]
Polish = [
  "Fixed: Who watched what no longer breaks on two same-name accounts. (#734)",
  "Fixed: old import reports open, and plugin screens drop garbled symbols. (#925)",
  "Changed: the key icon's bar starts at the ring's edge. (#683)",
  "Changed: plain permission names, full-width own-server box, one-line TV shows button. (#945)",
]

