name: holyarrs-metadata
services:
  metadata:
    image: holyarrs-metadata:live
    container_name: holyarrs-metadata
    restart: unless-stopped
    # Keys live in .env (mode 600, never printed or committed).
    # egress.env (not secret): HOLYARRS_MB_EGRESS, the outgoing paths
    # MusicBrainz calls are spread over (empty or missing: one address).
    env_file:
      - .env
      - path: egress.env
        required: false
    mem_limit: 16g
    environment:
      GOMEMLIMIT: 12GiB
      # Slim MusicBrainz copy (mbimport builds it beside; CURRENT names the one in use).
      HOLYARRS_MB_SLIM_ROOT: /music
    # Two of the VM's four cores; picture work takes at most two at once.
    cpus: 2.0
    pids_limit: 256
    read_only: true
    # Scratch space. Nothing runs from here any more; exec is left as it was.
    tmpfs:
      - /tmp:size=256m,exec,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    volumes:
      - metadata-data:/data
      # The Apple Music key (mode 600, the container user), read only.
      - ./secrets/apple_music.p8:/run/secrets/apple_music.p8:ro
      - /home/home/music-next:/music:ro
    networks: [tunnel]
    # A swap's new process takes the store once this one has drained its
    # requests and exited (swap.sh).
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/metadata", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m
      start_interval: 1s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  metadata-data:
networks:
  tunnel:
    name: holycore-bot_bot-network
    external: true
